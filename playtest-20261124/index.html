		<style>
html, body, #canvas { margin: 0; padding: 0; border: 0; }
body { color: white; background-color: black; overflow: hidden; touch-action: none; }
#canvas { display: block; }
#canvas:focus { outline: none; }
#status, #status-splash, #status-progress { position: absolute; left: 0; right: 0; }
#status, #status-splash { top: 0; bottom: 0; }
#status { background-color: #242424; display: flex; flex-direction: column; justify-content: center; align-items: center; visibility: hidden; }
#status-splash { max-height: 100%; max-width: 100%; margin: auto; }

#status-splash.fullsize--true { height: 100%; width: 100%; object-fit: contain; }
#status-splash.use-filter--false { image-rendering: pixelated; }
#status-progress, #status-notice { display: none; }
#status-progress { bottom: 10%; width: 50%; margin: 0 auto; }
#status-notice { background-color: #5b3943; border-radius: 0.5rem; border: 1px solid #9b3943; color: #e0e0e0; font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif; line-height: 1.3; margin: 0 2rem; overflow: hidden; padding: 1rem; text-align: center; z-index: 1; }

		<script>
var BUILD_REV = "playtest-20261124-goon1";
var PCK_PARTS = ["index.pck.part0", "index.pck.part1"];
function garageCyborgUnlockAudio() {
	var list = window.__garageCyborgAudio || [];
	for (var i = 0; i < list.length; i++) {
		var ctx = list[i];
		if (ctx && ctx.state !== "running" && ctx.resume) {
			try { ctx.resume(); } catch (e) {}
		}
	}
	var live = list.length ? list[list.length - 1] : null;
	if (live) console.log("AUDIO_CTX " + live.state);
}
(function () {
	var Orig = window.AudioContext || window.webkitAudioContext;
	if (!Orig) return;
	window.__garageCyborgAudio = [];
	function WrappedAudioContext() {
		var ctx = new Orig(...arguments);
		window.__garageCyborgAudio.push(ctx);
		return ctx;
	}
	WrappedAudioContext.prototype = Orig.prototype;
	window.AudioContext = WrappedAudioContext;
	if (window.webkitAudioContext) window.webkitAudioContext = WrappedAudioContext;
	window.addEventListener("pointerdown", garageCyborgUnlockAudio, true);
	window.addEventListener("keydown", garageCyborgUnlockAudio, true);
})();
(function () {
	var origFetch = window.fetch;
	var pckPromise = null;
	function isPckRequest(url) {
		try {
			var path = new URL(url, window.location.href).pathname;
			return path.endsWith("/index.pck") || path.endsWith("index.pck");
		} catch (e) { return false; }
	}
	function loadPck() {
		if (!pckPromise) {
			pckPromise = Promise.all(PCK_PARTS.map(function (part) {
				return origFetch(part + "?v=" + BUILD_REV).then(function (res) {
					if (!res.ok) throw new Error("Failed to load " + part + " (" + res.status + ")");
					return res.arrayBuffer();
				});
			})).then(function (bufs) {
				var total = 0;
				for (var i = 0; i < bufs.length; i++) total += bufs[i].byteLength;
				var out = new Uint8Array(total);
				var off = 0;
				for (var j = 0; j < bufs.length; j++) {
					out.set(new Uint8Array(bufs[j]), off);
					off += bufs[j].byteLength;
				}
				console.log("PCK_STITCH bytes=" + total);
				return out.buffer;
			});
		}
		return pckPromise;
	}
	window.fetch = function (input, init) {
		var url = typeof input === "string" ? input : (input && input.url);
		if (url && isPckRequest(url)) {
			return loadPck().then(function (buf) {
				return new Response(buf, { headers: { "Content-Type": "application/octet-stream" } });
			});
		}
		return origFetch.call(window, input, init);
	};
})();
		</script>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>
		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":166316756,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);
(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	let initializing = true;
	let statusMode = '';
	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) return;
		if (mode === 'hidden') { statusOverlay.remove(); initializing = false; return; }
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}
	function setStatusNotice(text) {
		while (statusNotice.lastChild) statusNotice.removeChild(statusNotice.lastChild);
		text.split('\n').forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}
	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) setStatusNotice(err.message);
		else if (typeof err === 'string') setStatusNotice(err);
		else setStatusNotice('An unknown error occurred.');
		setStatusMode('notice');
		initializing = false;
	}
	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		displayFailureNotice('Error\nThe following features required to run Godot projects on the Web are missing:\n' + missing.join('\n'));
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) { statusProgress.value = current; statusProgress.max = total; }
				else { statusProgress.removeAttribute('value'); statusProgress.removeAttribute('max'); }
			},
		}).then(() => { setStatusMode('hidden'); console.log('ENGINE_READY'); }, displayFailureNotice);
	}
}());
		</script>
